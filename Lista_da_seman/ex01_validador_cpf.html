<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01 – Validador de CPF</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0f14;
            --card: #161921;
            --border: #252932;
            --accent: #e67e22;
            --green: #2ecc71;
            --red: #e74c3c;
            --text: #e8eaf0;
            --muted: #7a8099;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Sora', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #f39c12);
        }

        .badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 300;
            margin-bottom: 36px;
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: #0d0f14;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: var(--text);
            letter-spacing: 3px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent); }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 1px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:hover { opacity: 0.85; }
        button:active { transform: scale(0.98); }

        #resultado {
            margin-top: 24px;
            padding: 16px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        #resultado.valido {
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid var(--green);
            color: var(--green);
        }

        #resultado.invalido {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid var(--red);
            color: var(--red);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <p class="badge">⚡ Exercício 01</p>
        <h1>Validador de CPF</h1>
        <p class="subtitle">Digite o CPF para verificar os dígitos verificadores</p>

        <label for="cpf">Número do CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
        <button onclick="validarCPF()">Validar CPF</button>

        <div id="resultado"></div>
    </div>

    <script>
        const input = document.getElementById('cpf');

        input.addEventListener('input', () => {
            let v = input.value.replace(/\D/g, '');
            if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
            else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
            else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
            input.value = v;
        });

        input.addEventListener('keydown', e => { if (e.key === 'Enter') validarCPF(); });

        function calcDigito(nums, pesoInicial) {
            let soma = 0;
            for (let i = 0; i < nums.length; i++) soma += nums[i] * (pesoInicial - i);
            const resto = (soma * 10) % 11;
            return resto === 10 ? 0 : resto;
        }

        function validarCPF() {
            const resultado = document.getElementById('resultado');
            const digits = input.value.replace(/\D/g, '');

            resultado.style.display = 'block';

            if (digits.length !== 11 || /^(\d)\1{10}$/.test(digits)) {
                resultado.className = 'invalido';
                resultado.textContent = '✗  CPF Inválido — sequência inválida ou incompleta';
                return;
            }

            const nums = digits.split('').map(Number);
            const d1 = calcDigito(nums.slice(0, 9), 10);
            const d2 = calcDigito(nums.slice(0, 10), 11);

            if (d1 === nums[9] && d2 === nums[10]) {
                resultado.className = 'valido';
                resultado.textContent = '✓  CPF Válido — dígitos verificadores conferem!';
            } else {
                resultado.className = 'invalido';
                resultado.textContent = '✗  CPF Inválido — dígitos verificadores incorretos';
            }
        }
    </script>
</body>
</html>
