<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 03 – Média Escolar</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #f5f0e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 8px 8px 0px #2c3e50;
            border: 2px solid #2c3e50;
        }

        .badge {
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            color: #e67e22;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 { font-size: 1.9rem; font-weight: 800; color: #2c3e50; margin-bottom: 6px; }
        .subtitle { color: #7f8c8d; font-size: 0.9rem; font-weight: 300; margin-bottom: 36px; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #2c3e50;
            margin-bottom: 6px;
            margin-top: 16px;
        }

        label:first-of-type { margin-top: 0; }

        input {
            width: 100%;
            background: #f5f0e8;
            border: 2px solid #2c3e50;
            border-radius: 8px;
            padding: 12px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 1rem;
            color: #2c3e50;
            outline: none;
            transition: background 0.2s;
        }

        input:focus { background: #ffe8cc; }

        .notas {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #2c3e50;
            color: #fff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            border: 2px solid #2c3e50;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        button:hover { background: #e67e22; border-color: #e67e22; }
        button:active { transform: scale(0.98); }

        #resultado {
            margin-top: 24px;
            padding: 20px;
            border-radius: 10px;
            display: none;
            border: 2px solid;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }

        #resultado .media-val {
            font-family: 'Space Mono', monospace;
            font-size: 2.2rem;
            font-weight: 700;
            display: block;
            margin-bottom: 4px;
        }

        #resultado .situacao {
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #resultado .extra { font-size: 0.85rem; margin-top: 6px; }

        .aprovado  { background: #ebf5fb; border-color: #2980b9; color: #2980b9; }
        .exame     { background: #eafaf1; border-color: #27ae60; color: #27ae60; }
        .reprovado { background: #fdedec; border-color: #e74c3c; color: #e74c3c; }
    </style>
</head>
<body>
    <div class="card">
        <p class="badge">🎓 Exercício 03</p>
        <h1>Média Escolar</h1>
        <p class="subtitle">Informe o nome e as três notas para calcular a situação</p>

        <label for="nome">Nome do Aluno</label>
        <input type="text" id="nome" placeholder="Ex: João da Silva">

        <label>Notas (0 – 10)</label>
        <div class="notas">
            <input type="number" id="n1" placeholder="Nota 1" min="0" max="10" step="0.1">
            <input type="number" id="n2" placeholder="Nota 2" min="0" max="10" step="0.1">
            <input type="number" id="n3" placeholder="Nota 3" min="0" max="10" step="0.1">
        </div>

        <button onclick="calcularMedia()">Calcular Resultado</button>

        <div id="resultado"></div>
    </div>

    <script>
        function calcularMedia() {
            const nome = document.getElementById('nome').value.trim() || 'Aluno';
            const n1 = Number(document.getElementById('n1').value);
            const n2 = Number(document.getElementById('n2').value);
            const n3 = Number(document.getElementById('n3').value);
            const media = (n1 + n2 + n3) / 3;
            const div = document.getElementById('resultado');
            div.style.display = 'block';

            let classe, situacao, extra = '';

            if (media >= 7) {
                classe = 'aprovado';
                situacao = '✓ Aprovado';
            } else if (media >= 4) {
                classe = 'exame';
                situacao = '⚠ Em Exame';
                const falta = 10 - media;
                extra = `Para atingir 10 no exame, precisa de <strong>${falta.toFixed(2)}</strong> pontos extras.`;
            } else {
                classe = 'reprovado';
                situacao = '✗ Reprovado';
            }

            div.className = classe;
            div.innerHTML = `
                <span class="media-val">${media.toFixed(2)}</span>
                <span class="situacao">${situacao}</span>
                <p style="margin-top:4px; font-size:.85rem;">${nome}</p>
                ${extra ? `<p class="extra">${extra}</p>` : ''}
            `;
        }
    </script>
</body>
</html>
