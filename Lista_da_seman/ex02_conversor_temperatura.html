<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02 – Conversor de Temperatura</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
        }

        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 50px 42px;
            width: 100%;
            max-width: 480px;
            color: #fff;
        }

        .badge {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: #4dd9e1;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 { font-size: 1.9rem; font-weight: 900; margin-bottom: 6px; }
        .subtitle { color: rgba(255,255,255,0.55); font-weight: 300; font-size: 0.9rem; margin-bottom: 40px; }

        .row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .field { flex: 1; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 8px;
        }

        .unit {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            overflow: hidden;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 14px;
            font-family: 'DM Mono', monospace;
            font-size: 1.3rem;
            color: #fff;
            outline: none;
            width: 100%;
        }

        input::placeholder { color: rgba(255,255,255,0.2); }

        .symbol {
            padding: 0 14px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4dd9e1;
            border-left: 1px solid rgba(255,255,255,0.1);
        }

        .divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: rgba(255,255,255,0.3);
            font-size: 1.4rem;
            padding-top: 22px;
        }

        .thermometer {
            margin-top: 36px;
            height: 8px;
            border-radius: 99px;
            background: linear-gradient(90deg, #4dd9e1, #f39c12, #e74c3c);
            position: relative;
            overflow: visible;
        }

        .marker {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            border: 3px solid #0f2027;
            transition: left 0.4s cubic-bezier(.22,.68,0,1.2);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="card">
        <p class="badge">🌡️ Exercício 02</p>
        <h1>Conversor de<br>Temperatura</h1>
        <p class="subtitle">Conversão em tempo real entre Celsius e Fahrenheit</p>

        <div class="row">
            <div class="field">
                <label>Celsius</label>
                <div class="unit">
                    <input type="number" id="celsius" step="0.1" placeholder="0">
                    <span class="symbol">°C</span>
                </div>
            </div>
            <div class="divider">⇄</div>
            <div class="field">
                <label>Fahrenheit</label>
                <div class="unit">
                    <input type="number" id="fahrenheit" step="0.1" placeholder="32">
                    <span class="symbol">°F</span>
                </div>
            </div>
        </div>

        <div class="thermometer" style="margin-top: 36px;">
            <div class="marker" id="marker" style="left: 30%"></div>
        </div>
    </div>

    <script>
        const cInput = document.getElementById('celsius');
        const fInput = document.getElementById('fahrenheit');
        const marker = document.getElementById('marker');

        function updateMarker(c) {
            // Map -40°C to 100°C → 0% to 100%
            const pct = Math.min(100, Math.max(0, ((c + 40) / 140) * 100));
            marker.style.left = pct + '%';
        }

        cInput.addEventListener('input', () => {
            if (cInput.value === '') { fInput.value = ''; return; }
            const c = parseFloat(cInput.value);
            fInput.value = ((c * 9 / 5) + 32).toFixed(2);
            updateMarker(c);
        });

        fInput.addEventListener('input', () => {
            if (fInput.value === '') { cInput.value = ''; return; }
            const f = parseFloat(fInput.value);
            const c = (f - 32) * 5 / 9;
            cInput.value = c.toFixed(2);
            updateMarker(c);
        });
    </script>
</body>
</html>
