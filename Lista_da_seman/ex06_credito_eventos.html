<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 06 – Crédito para Eventos</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(160deg, #1a0533 0%, #0d0d1f 60%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Inter', sans-serif;
            color: #f0eaff;
        }

        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 50px 42px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }

        .badge {
            font-size: 0.68rem;
            color: #b48aff;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.1rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 6px;
        }

        .subtitle { color: rgba(255,255,255,0.4); font-size: 0.88rem; margin-bottom: 36px; }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 7px;
        }

        select, input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 13px 15px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: #f0eaff;
            outline: none;
            transition: border-color 0.2s;
            appearance: none;
        }

        select:focus, input:focus { border-color: #b48aff; }

        /* Pacote cards */
        .pacotes {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 18px;
        }

        .pacote-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #f0eaff;
        }

        .pacote-btn:hover, .pacote-btn.ativo {
            background: rgba(180,138,255,0.15);
            border-color: #b48aff;
        }

        .pacote-btn .pkg-nome { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .pacote-btn .pkg-preco { font-size: 1rem; font-weight: 700; color: #b48aff; margin-top: 2px; }

        button.calcular {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #b48aff, #7c5cbf);
            color: #0d0d1f;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 4px;
        }

        button.calcular:hover { opacity: 0.88; }
        button.calcular:active { transform: scale(0.98); }

        #orcamento { margin-top: 28px; display: none; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .linha {
            display: flex;
            justify-content: space-between;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.9rem;
        }

        .linha .l { color: rgba(255,255,255,0.5); }
        .linha .v { font-weight: 600; }

        .linha.green .v { color: #2ecc71; }
        .linha.total { border-top: 1px solid rgba(180,138,255,0.3); border-bottom: none; padding-top: 16px; margin-top: 4px; }
        .linha.total .l { color: #f0eaff; font-weight: 700; }
        .linha.total .v { color: #b48aff; font-size: 1.15rem; }
    </style>
</head>
<body>
    <div class="card">
        <p class="badge">🎉 Exercício 06</p>
        <h1>Crédito para<br>Festas & Eventos</h1>
        <p class="subtitle">Infinity Bank — Orçamento instantâneo para seu evento</p>

        <label>Escolha o Pacote</label>
        <div class="pacotes">
            <div class="pacote-btn ativo" onclick="selecionarPacote(this, 50)" data-valor="50">
                <div class="pkg-nome">Standard</div>
                <div class="pkg-preco">R$50</div>
            </div>
            <div class="pacote-btn" onclick="selecionarPacote(this, 80)" data-valor="80">
                <div class="pkg-nome">Premium</div>
                <div class="pkg-preco">R$80</div>
            </div>
            <div class="pacote-btn" onclick="selecionarPacote(this, 120)" data-valor="120">
                <div class="pkg-nome">Deluxe</div>
                <div class="pkg-preco">R$120</div>
            </div>
        </div>

        <div class="form-group">
            <label for="pessoas">Quantidade de Pessoas</label>
            <input type="number" id="pessoas" placeholder="Ex: 80" min="1">
        </div>

        <button class="calcular" onclick="calcular()">Calcular Orçamento</button>

        <div id="orcamento">
            <div class="linha"><span class="l">Custo bruto</span><span class="v" id="r-bruto">—</span></div>
            <div class="linha"><span class="l">Taxa de serviço (10%)</span><span class="v" id="r-taxa">—</span></div>
            <div class="linha green"><span class="l">Desconto fidelidade (5%)</span><span class="v" id="r-desc">—</span></div>
            <div class="linha total"><span class="l">Total Final</span><span class="v" id="r-total">—</span></div>
        </div>
    </div>

    <script>
        let valorPacote = 50;

        function selecionarPacote(el, valor) {
            document.querySelectorAll('.pacote-btn').forEach(b => b.classList.remove('ativo'));
            el.classList.add('ativo');
            valorPacote = valor;
        }

        function fmt(n) { return 'R$ ' + n.toFixed(2).replace('.', ','); }

        function calcular() {
            const pessoas = parseInt(document.getElementById('pessoas').value) || 0;
            if (pessoas <= 0) { alert('Informe a quantidade de pessoas.'); return; }

            const bruto = valorPacote * pessoas;
            const taxa = bruto * 0.10;
            const comTaxa = bruto + taxa;
            const desconto = pessoas > 100 ? comTaxa * 0.05 : 0;
            const total = comTaxa - desconto;

            document.getElementById('r-bruto').textContent = fmt(bruto);
            document.getElementById('r-taxa').textContent  = fmt(taxa);
            document.getElementById('r-desc').textContent  = desconto > 0 ? `- ${fmt(desconto)}` : 'Não aplicável';
            document.getElementById('r-total').textContent = fmt(total);

            document.getElementById('orcamento').style.display = 'block';
        }
    </script>
</body>
</html>
